name: Build C++ to EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile main.cpp
        shell: pwsh
        run: |
          g++ main.cpp -o program3.exe -static -std=c++17

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: program-windows-exe
          path: program.exe
